<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ERP 实时看板</title>
  <style>:root {
  color-scheme: light dark;
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-soft: #f9f9fb;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --line: #d9d9de;
  --blue: #007aff;
  --blue-soft: #eaf3ff;
  --green: #248a3d;
  --red: #d70015;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111113;
    --surface: #1c1c1e;
    --surface-soft: #242426;
    --text: #f5f5f7;
    --muted: #a1a1a6;
    --line: #3a3a3c;
    --blue: #0a84ff;
    --blue-soft: #102a43;
    --green: #30d158;
    --red: #ff453a;
    --shadow: none;
  }
}

* { box-sizing: border-box; }
html, body { max-width: 100%; }
body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; }
button, input, select { font: inherit; }
button { cursor: pointer; }
.shell { width: 100%; min-width: 0; max-width: 1120px; margin: 0 auto; padding: 28px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 20px; }
.eyebrow { margin: 0 0 6px; color: var(--muted); font-size: 13px; font-weight: 650; }
h1, h2, p { letter-spacing: 0; }
h1 { margin: 0; font-size: 32px; line-height: 1.18; text-wrap: pretty; }
h2 { margin: 0; font-size: 18px; line-height: 1.3; }
.lede { margin: 8px 0 0; color: var(--muted); line-height: 1.55; }
.badge { flex: 0 0 auto; padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--surface); font-size: 12px; }
.badge.ready { color: var(--green); border-color: color-mix(in srgb, var(--green) 35%, var(--line)); }
.badge.error { color: var(--red); border-color: color-mix(in srgb, var(--red) 35%, var(--line)); }
.view-switch { min-width: 0; max-width: 100%; display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-soft); margin-bottom: 12px; }
.view-button { min-width: 0; min-height: 52px; border: 0; border-radius: 6px; padding: 7px 14px; background: transparent; color: var(--muted); overflow-wrap: anywhere; text-align: left; }
.view-button strong, .view-button small { display: block; letter-spacing: 0; }
.view-button strong { color: inherit; font-size: 14px; }
.view-button small { margin-top: 2px; font-size: 11px; font-weight: 400; }
.view-button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 5px rgba(0,0,0,.08); }
.filter-band { border-block: 1px solid var(--line); padding: 16px 0; }
.filter-grid { min-width: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.field { min-width: 0; display: grid; gap: 7px; color: var(--muted); font-size: 13px; }
select, input { width: 100%; min-width: 0; height: 42px; border: 1px solid var(--line); border-radius: 8px; padding: 0 11px; color: var(--text); background: var(--surface); outline: none; }
select:focus, input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent); }
.filter-actions { display: flex; align-items: center; gap: 12px; margin-top: 14px; color: var(--muted); font-size: 13px; }
.primary, .secondary { min-height: 42px; border-radius: 8px; padding: 0 16px; font-weight: 650; }
.primary { border: 1px solid var(--blue); color: #fff; background: var(--blue); }
.secondary { border: 1px solid var(--line); color: var(--blue); background: var(--surface); }
.primary:disabled, .secondary:disabled { cursor: wait; opacity: .55; }
.result-layout { min-width: 0; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(250px, .8fr); gap: 14px; margin-top: 18px; }
.metric-card, .promise-panel { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); }
.metric-card { min-width: 0; padding: 22px; min-height: 238px; }
.metric-topline { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); font-size: 13px; }
.small-status { color: var(--green); }
.metric-value { display: block; width: 100%; min-width: 0; max-width: 100%; margin: 22px 0 10px; padding: 0; border: 0; background: transparent; color: var(--text); font-size: 48px; line-height: 1.05; font-weight: 760; text-align: left; white-space: normal; overflow-wrap: anywhere; }
.metric-value.clickable { color: var(--blue); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; }
.metric-rule { margin: 0; color: var(--muted); line-height: 1.65; text-wrap: pretty; }
.text-action { margin-top: 16px; padding: 0; border: 0; color: var(--blue); background: transparent; }
.promise-panel { padding: 20px; background: var(--surface-soft); }
.promise-panel ol { display: grid; gap: 14px; margin: 18px 0 0; padding: 0; list-style: none; color: var(--muted); }
.promise-panel li { display: flex; align-items: center; gap: 10px; line-height: 1.45; }
.promise-panel li span { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: var(--blue); background: var(--blue-soft); font-size: 12px; font-weight: 700; }
.secondary-metric { min-width: 0; display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-top: 18px; padding: 18px 0; border-block: 1px solid var(--line); }
.secondary-metric p { margin: 7px 0 0; color: var(--muted); line-height: 1.55; }
.secondary-result { flex: 0 0 auto; display: grid; justify-items: end; gap: 10px; }
.secondary-result strong { max-width: 100%; font-size: 24px; overflow-wrap: anywhere; }
.detail-section { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 18px; }
.section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.icon-button { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); background: var(--surface); font-size: 24px; }
.empty-state { min-height: 96px; display: grid; place-items: center; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); padding: 20px; text-align: center; }
.table-wrap { overflow: auto; max-height: 420px; border: 1px solid var(--line); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface-soft); color: var(--muted); font-weight: 650; }
#loadMore { margin-top: 12px; }
.error-panel { margin-top: 14px; border: 1px solid color-mix(in srgb, var(--red) 35%, var(--line)); border-radius: 8px; padding: 14px; color: var(--red); background: color-mix(in srgb, var(--red) 7%, var(--surface)); }
.technical { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; color: var(--muted); font-size: 13px; }
.technical summary { cursor: pointer; }
.technical pre { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
.hidden { display: none !important; }

@media (max-width: 820px) {
  .shell { padding: 18px; }
  .page-head { display: block; }
  .badge { display: inline-block; margin-top: 12px; }
  .view-switch { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
  .view-button { height: auto; min-height: 42px; padding: 7px 8px; line-height: 1.3; white-space: normal; }
  .filter-grid, .result-layout { grid-template-columns: 1fr; }
  .filter-actions { align-items: stretch; flex-direction: column; }
  .primary { width: 100%; }
  .metric-value { font-size: 34px; }
  .secondary-metric { align-items: stretch; flex-direction: column; }
  .secondary-result { justify-items: stretch; }
  .secondary-result strong { font-size: 22px; }
}

@media (prefers-reduced-motion: no-preference) {
  button { transition: opacity 160ms ease, background-color 160ms ease, color 160ms ease, border-color 160ms ease; }
  button:active { opacity: .72; }
}
</style>
</head>
<body>
  <main class="shell">
    <header class="page-head">
      <div>
        <p class="eyebrow">ERP 实时看板</p>
        <h1>新上房源数量</h1>
        <p id="summaryText" class="lede">正在接收已确认的统计结果。</p>
      </div>
      <span id="connectionBadge" class="badge pending">正在连接</span>
    </header>

    <nav class="view-switch" aria-label="选择查看方式">
      <button id="orgView" class="view-button active" type="button"><strong>按公司部门和人员看</strong><small>全公司、部门、门店或员工</small></button>
      <button id="locationView" class="view-button" type="button"><strong>按房源所在位置看</strong><small>区域、商圈或小区</small></button>
    </nav>

    <section class="filter-band" aria-label="查询条件">
      <div id="organizationFilters" class="filter-grid">
        <label class="field">统计月份<select id="month"><option value="上月">上月</option><option value="本月">本月</option></select></label>
        <label class="field">业务类型<select id="businessType"><option value="sell">买卖房源</option><option value="rent">租赁房源</option><option value="new_house">新房业务</option><option value="all">全部业务</option></select></label>
        <label class="field">部门或门店<select id="deptName"><option value="">全公司</option></select></label>
        <label class="field">人员<select id="userName"><option value="">全部人员</option></select></label>
      </div>
      <div id="locationFilters" class="filter-grid hidden">
        <label class="field">业务类型<select id="locationBusinessType"><option value="sell">买卖房源</option><option value="rent">租赁房源</option></select></label>
        <label class="field">区域<select id="districtName"><option value="">切换到此处后加载</option></select></label>
        <label class="field">商圈<select id="zoneName" disabled><option value="">请先选择区域</option></select></label>
        <label class="field">小区<select id="sectionLike" disabled><option value="">请先选择商圈</option></select></label>
      </div>
      <div class="filter-actions">
        <button id="refreshSummary" class="primary" type="button">刷新数字</button>
        <span id="filterHint">只查询汇总数字，不读取逐套房源。</span>
      </div>
    </section>

    <section class="result-layout">
      <article class="metric-card" aria-live="polite">
        <div class="metric-topline">
          <span id="metricLabel">新上房源数量</span>
          <span id="metricStatus" class="small-status">等待结果</span>
        </div>
        <button id="metricValue" class="metric-value" type="button">暂无可验证数据</button>
        <p id="metricRule" class="metric-rule">数字返回后，这里会说明它是怎么统计的。</p>
        <button id="metricHelp" class="text-action" type="button">查看指标说明</button>
      </article>

      <aside class="promise-panel">
        <h2>页面会怎么查询</h2>
        <ol>
          <li><span>1</span>先返回一个汇总数字</li>
          <li><span>2</span>换条件时仍只刷新数字</li>
          <li><span>3</span>点击蓝色数字才读取明细</li>
        </ol>
      </aside>
    </section>

    <section id="secondaryMetric" class="secondary-metric hidden" aria-live="polite">
      <div>
        <p class="eyebrow">按需计算</p>
        <h2 id="secondaryLabel">当前新上房源挂牌均价</h2>
        <p id="secondaryRule">先显示新增数量；只有点击计算后才读取价格和面积字段。</p>
      </div>
      <div class="secondary-result">
        <strong id="secondaryValue">点击后计算</strong>
        <button id="calculatePrice" class="secondary" type="button">计算挂牌均价</button>
      </div>
    </section>

    <section id="detailSection" class="detail-section hidden" aria-live="polite">
      <div class="section-head">
        <div><p class="eyebrow">按需读取</p><h2>数字对应的明细</h2></div>
        <button id="closeDetails" class="icon-button" type="button" aria-label="关闭明细" title="关闭明细">×</button>
      </div>
      <div id="detailMessage" class="empty-state">点击可查看明细的蓝色数字后，这里才会读取数据。</div>
      <div id="tableWrap" class="table-wrap hidden"><table><thead id="detailHead"></thead><tbody id="detailBody"></tbody></table></div>
      <button id="loadMore" class="secondary hidden" type="button">加载更多</button>
    </section>

    <section id="errorPanel" class="error-panel hidden" role="alert"></section>

    <details class="technical">
      <summary>数据来源与技术说明</summary>
      <pre id="technicalText">等待查询结果。</pre>
    </details>
  </main>
