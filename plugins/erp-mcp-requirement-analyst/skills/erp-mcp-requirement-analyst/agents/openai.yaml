interface:
  display_name: "ERP MCP 快速数据助手 V4"
  short_description: "先问关键定义，再出数字，点击后才读明细"
  brand_color: "#007AFF"
  default_prompt: "Use $erp-mcp-requirement-analyst. For new-listing requests, do not use WorkBuddy native question cards. Open the bundled live Widget with confirmationMode=auto_recommended, show plain-Chinese choices, and let the Widget auto-continue after 5 minutes. Never probe ERP or preload records before Widget confirmation."

dependencies:
  tools:
    - type: "mcp"
      value: "erp_dashboard_proxy"
      description: "Bundled MCP Apps proxy for quick summaries, plain-language filters, click-only calculations, and click-only paginated details."

policy:
  allow_implicit_invocation: true
