<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP 数据需求确认</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--card:rgba(255,255,255,.88);--text:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.1);--blue:#007aff;--blueSoft:rgba(0,122,255,.1);--green:#34c759;--orange:#ff9f0a;--shadow:0 18px 48px rgba(0,0,0,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:rgba(28,28,30,.9);--text:#f5f5f7;--muted:#a1a1a6;--line:rgba(255,255,255,.13);--blueSoft:rgba(10,132,255,.18);--shadow:0 18px 48px rgba(0,0,0,.38)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:36px 20px 70px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.hero h1{font-size:clamp(32px,5vw,48px);margin:8px 0;line-height:1.06}.hero p{color:var(--muted);line-height:1.7;margin:0;max-width:760px}.progress{min-width:170px;color:var(--muted)}.bar{height:7px;background:var(--line);border-radius:999px;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--blue);transition:.2s}.panel,.card,.summary{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(20px)}.panel{margin-top:24px;padding:22px}.panel h2,.summary h2{margin:0 0 14px;font-size:20px}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 7px}.field select,.field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:transparent;color:var(--text);font:inherit}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;margin-top:18px;align-items:start}.questions{display:grid;gap:16px}.card{padding:22px}.qtitle{font-size:19px;font-weight:740;margin-bottom:14px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.option{border:1px solid var(--line);border-radius:16px;padding:15px;cursor:pointer;transition:.18s;outline:none}.option:hover{transform:translateY(-1px);border-color:rgba(0,122,255,.45)}.option:focus-visible{box-shadow:0 0 0 4px rgba(0,122,255,.2)}.option.selected{border-color:var(--blue);background:var(--blueSoft);box-shadow:0 0 0 1px var(--blue) inset}.otop{display:flex;justify-content:space-between;gap:10px}.olabel{font-weight:720}.check{color:var(--blue);font-weight:800}.desc{font-size:13px;color:var(--muted);line-height:1.55;margin-top:8px}.tag{display:inline-block;font-size:11px;padding:4px 8px;border-radius:999px;margin-top:9px;background:var(--line);color:var(--muted)}.tag.ok{background:rgba(52,199,89,.14);color:var(--green)}.tag.warn{background:rgba(255,159,10,.15);color:var(--orange)}.summary{padding:20px;position:sticky;top:16px}.summaryList{display:grid;gap:9px;color:var(--muted);font-size:14px}.actions{display:grid;gap:9px;margin-top:18px}button{border:0;border-radius:13px;padding:12px 15px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:var(--line);color:var(--text)}button:disabled{opacity:.4;cursor:not-allowed}.status{font-size:13px;line-height:1.5;color:var(--muted);margin-top:10px}.info{margin-top:15px;padding:13px;border-radius:14px;background:rgba(255,159,10,.1);font-size:13px;line-height:1.6;color:var(--muted)}details{margin-top:14px;color:var(--muted);font-size:13px}textarea{width:100%;min-height:90px;margin-top:10px;display:none;border:1px solid var(--line);border-radius:12px;padding:10px;background:transparent;color:var(--text)}
@media(max-width:860px){.hero{display:block}.progress{margin-top:17px}.layout{grid-template-columns:1fr}.summary{position:static}.filters{grid-template-columns:1fr 1fr}.options{grid-template-columns:1fr}}
@media(max-width:560px){.filters{grid-template-columns:1fr}.wrap{padding:24px 13px 55px}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><div><div style="color:var(--blue);font-size:13px;font-weight:750">ERP 数据助手</div><h1>先确认几个会影响结果的条件</h1><p>直接点击即可。系统查不到的内容会明确告诉你，不会编造数据，也不会建议导出系统并不支持的房源表。</p></div><div class="progress"><span id="progressText">查询条件已设置</span><div class="bar"><i id="bar"></i></div></div></section>
<section class="panel"><h2>基础筛选</h2><div class="filters" id="baseFilters"></div></section>
<div class="layout"><div class="questions" id="questions"></div><aside class="summary"><h2>本次选择</h2><div id="summary" class="summaryList">请完成必选项。</div><div class="actions"><button class="secondary" id="recommend">采用推荐设置</button><button class="secondary" id="reset">清空重选</button><button class="primary" id="confirm" disabled>复制选择结果</button></div><div id="status" class="status"></div><textarea id="fallback" readonly></textarea></aside></div>
</main>
<script>
const CONFIG=@@WIZARD_JSON@@;const state={};
function supportClass(s){if((s||"").includes("直接")||(s||"").includes("可以"))return"ok";if((s||"").includes("补充")||(s||"").includes("注意"))return"warn";return""}
function renderBase(){const root=document.getElementById("baseFilters");root.innerHTML="";(CONFIG.base_filters||[]).forEach(f=>{const div=document.createElement("div");div.className="field";let control="";if(f.type==="select"){control=`<select id="base_${f.id}">${(f.options||[]).map(x=>`<option>${x}</option>`).join("")}</select>`}else{control=`<input id="base_${f.id}" placeholder="${f.placeholder||""}">`}div.innerHTML=`<label>${f.label}</label>${control}`;root.appendChild(div);div.querySelector("select,input").addEventListener("change",update)});}
function renderQuestions(){const root=document.getElementById("questions");root.innerHTML="";(CONFIG.questions||[]).forEach(q=>{const card=document.createElement("section");card.className="card";card.innerHTML=`<div class="qtitle">${q.title}</div><div class="options" data-question="${q.id}"></div>`;const box=card.querySelector(".options");q.options.forEach(o=>{const el=document.createElement("div");el.className="option";el.tabIndex=0;el.dataset.value=o.value;el.innerHTML=`<div class="otop"><span class="olabel">${o.label}</span><span class="check"></span></div><div class="desc">${o.description||""}</div><span class="tag ${supportClass(o.support)}">${o.support||"需要确认"}</span>${o.recommended?'<span class="tag ok">推荐</span>':''}`;el.onclick=()=>select(q.id,o.value,el);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();el.click()}};box.appendChild(el)});root.appendChild(card)});(CONFIG.info_cards||[]).forEach(c=>{const card=document.createElement("section");card.className="card";card.innerHTML=`<div class="qtitle">${c.title}</div><div class="info" style="margin-top:0">${c.body}</div><details><summary>数据来源与技术说明</summary><p>${c.technical||"技术字段和接口细节只在这里展示。"}</p></details>`;root.appendChild(card)});}
function select(key,value,el){state[key]=value;const group=el.closest("[data-question]");[...group.querySelectorAll(".option")].forEach(x=>{const yes=x===el;x.classList.toggle("selected",yes);x.setAttribute("aria-checked",String(yes));x.querySelector(".check").textContent=yes?"✓":""});update()}
function baseValues(){const out={};(CONFIG.base_filters||[]).forEach(f=>{const el=document.getElementById(`base_${f.id}`);if(el)out[f.label]=el.value});return out}
function payload(){const base=baseValues();const answers={};(CONFIG.questions||[]).forEach(q=>{const opt=(q.options||[]).find(o=>o.value===state[q.id]);if(opt)answers[q.title]={value:opt.label,support:opt.support||"",export_required:!!opt.export_required,notes:opt.notes||""}});return {version:"2.0",selected_at:new Date().toISOString(),goal:CONFIG.goal||"ERP 数据需求",base_filters:base,answers,human_summary:[...Object.entries(base).map(([k,v])=>`${k}=${v}`),...Object.entries(answers).map(([k,v])=>`${k}=${v.value}`)].join("；")}}
function update(){const required=(CONFIG.questions||[]).filter(q=>q.required);const done=required.filter(q=>state[q.id]).length;const left=required.length-done;document.getElementById("progressText").textContent=required.length?left?`还需确认 ${left} 项`:"查询条件已确认":"查询条件已设置";document.getElementById("bar").style.width=required.length?`${done/required.length*100}%`:"100%";document.getElementById("confirm").disabled=done!==required.length;const p=payload();document.getElementById("summary").innerHTML=p.human_summary?p.human_summary.split("；").map(x=>`<div>✓ ${x}</div>`).join(""):"查询条件已设置。";}
document.getElementById("recommend").onclick=()=>{(CONFIG.questions||[]).forEach(q=>{const opt=(q.options||[]).find(o=>o.recommended)||q.options?.[0];if(opt){const el=document.querySelector(`[data-question="${q.id}"] .option[data-value="${opt.value}"]`);if(el)select(q.id,opt.value,el)}})};
document.getElementById("reset").onclick=()=>{Object.keys(state).forEach(k=>delete state[k]);document.querySelectorAll(".option").forEach(x=>{x.classList.remove("selected");x.querySelector(".check").textContent=""});document.getElementById("status").textContent="";update()};
document.getElementById("confirm").onclick=async()=>{const text=JSON.stringify(payload(),null,2);try{await navigator.clipboard.writeText(text);document.getElementById("status").textContent="已复制。请返回 WorkBuddy 粘贴发送。"}catch(e){const t=document.getElementById("fallback");t.style.display="block";t.value=text;t.select();document.getElementById("status").textContent="无法自动复制，请复制下方文字。"}};
renderBase();renderQuestions();update();
</script>
</body>
</html>
