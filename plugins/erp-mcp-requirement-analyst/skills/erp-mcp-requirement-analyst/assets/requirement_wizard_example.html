<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP 统计口径确认</title>
<style>
:root {
  color-scheme: light dark;
  --bg:#f5f5f7; --surface:rgba(255,255,255,.82); --text:#1d1d1f; --muted:#6e6e73;
  --line:rgba(0,0,0,.08); --blue:#007aff; --blue-soft:rgba(0,122,255,.10);
  --green:#34c759; --orange:#ff9f0a; --red:#ff3b30; --shadow:0 18px 50px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark) {
  :root { --bg:#000; --surface:rgba(28,28,30,.82); --text:#f5f5f7; --muted:#a1a1a6;
    --line:rgba(255,255,255,.12); --blue-soft:rgba(10,132,255,.18); --shadow:0 18px 50px rgba(0,0,0,.4); }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;}
.shell{max-width:1060px;margin:0 auto;padding:42px 22px 80px}
.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:26px}
.eyebrow{font-size:13px;font-weight:650;color:var(--blue);letter-spacing:.04em}
h1{font-size:clamp(30px,5vw,48px);line-height:1.08;margin:8px 0 10px;letter-spacing:-.04em}
.sub{color:var(--muted);font-size:16px;line-height:1.65;max-width:720px}
.progress{min-width:150px;text-align:right;color:var(--muted);font-size:14px}
.bar{height:7px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;width:0;background:var(--blue);border-radius:inherit;transition:width .2s ease}
.grid{display:grid;gap:18px}
.card{background:var(--surface);backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.qhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.num{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:var(--blue-soft);color:var(--blue);font-weight:750}
.qtitle{font-size:19px;font-weight:720;line-height:1.35}
.required{font-size:12px;color:var(--red);margin-left:6px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.option{position:relative;border:1px solid var(--line);border-radius:16px;padding:15px 15px 14px;cursor:pointer;transition:.18s ease;background:rgba(255,255,255,.18);outline:none}
.option:hover{transform:translateY(-1px);border-color:rgba(0,122,255,.42)}
.option:focus-visible{box-shadow:0 0 0 4px rgba(0,122,255,.22)}
.option.selected{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 1px var(--blue) inset}
.option-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.label{font-weight:700;font-size:15px}
.check{width:22px;height:22px;border:1.5px solid var(--line);border-radius:50%;display:grid;place-items:center;color:#fff}
.selected .check{background:var(--blue);border-color:var(--blue)}
.desc{font-size:13px;line-height:1.45;color:var(--muted);margin-top:7px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11px;padding:4px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.tag.reco{background:rgba(52,199,89,.14);color:var(--green)}
.summary{margin-top:18px}
.summary h2{font-size:18px;margin:0 0 10px}
.summary-list{display:grid;gap:8px;color:var(--muted);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
button{border:0;border-radius:13px;padding:12px 18px;font:inherit;font-weight:680;cursor:pointer;transition:.18s ease}
.primary{background:var(--blue);color:white}
.primary:disabled{opacity:.38;cursor:not-allowed}
.secondary{background:var(--line);color:var(--text)}
.status{margin-top:12px;font-size:13px;color:var(--muted);min-height:20px}
.notice{border-left:3px solid var(--orange);padding-left:12px;color:var(--muted);font-size:13px;line-height:1.55;margin-top:12px}
textarea{width:100%;min-height:100px;margin-top:12px;border-radius:14px;border:1px solid var(--line);padding:12px;background:transparent;color:var(--text);display:none}
@media(max-width:720px){.hero{display:block}.progress{text-align:left;margin-top:18px}.options{grid-template-columns:1fr}.shell{padding:26px 14px 60px}}
</style>
</head>
<body>
<main class="shell">
  <section class="hero">
    <div>
      <div class="eyebrow">ERP MCP · 需求确认</div>
      <h1>先确认会影响结果的口径</h1>
      <div class="sub">直接点击选项即可。页面会标明 MCP 是否支持、是否需要导出表格，以及已知限制。这里没有任何真实业务数据。</div>
    </div>
    <div class="progress"><span id="progressText">已完成 0/4 项</span><div class="bar"><i id="bar"></i></div></div>
  </section>
  <div id="questions" class="grid"></div>
  <section class="card summary">
    <h2>本次统计口径摘要</h2>
    <div id="summary" class="summary-list">尚未完成选择。</div>
    <div class="notice">自动回传只有在 WorkBuddy 提供并验证了正式桥接能力时才启用。本演示页面默认使用一键复制作为安全兜底。</div>
    <div class="actions">
      <button class="secondary" id="recommend">采用推荐设置</button>
      <button class="secondary" id="reset">清空重选</button>
      <button class="primary" id="submit" disabled>确认并继续</button>
      <button class="secondary" id="download">下载选择 JSON</button>
    </div>
    <div class="status" id="status"></div>
    <textarea id="fallback" readonly aria-label="可手动复制的选择结果"></textarea>
  </section>
</main>
<script>
const QUESTIONS = [{"id": "owner_role", "title": "开单归属按谁计算？", "required": true, "options": [{"id": "A", "label": "签约人", "desc": "按合同明细中的签约人归属", "status": "MCP直接支持", "recommended": true}, {"id": "B", "label": "业绩分配人", "desc": "一份合同可能归属多人", "status": "MCP直接支持", "recommended": false}, {"id": "C", "label": "房源方经纪人", "desc": "按房源侧经纪人归属", "status": "MCP直接支持", "recommended": false}, {"id": "D", "label": "客源方经纪人", "desc": "按客源侧经纪人归属", "status": "MCP直接支持", "recommended": false}]}, {"id": "date_basis", "title": "合同按哪个日期筛选？", "required": true, "options": [{"id": "A", "label": "签约日期", "desc": "合同明细工具说明支持", "status": "MCP直接支持", "recommended": true}, {"id": "B", "label": "结单日期", "desc": "需按查询类型核对实际返回", "status": "MCP部分支持", "recommended": false}, {"id": "C", "label": "ERP 官方统计日期", "desc": "底层业务日期未公开", "status": "口径需说明", "recommended": false}, {"id": "D", "label": "合同录入日期", "desc": "当前没有可靠字段", "status": "建议新增接口", "recommended": false}]}, {"id": "staff_denominator", "title": "人员分母使用哪一类？", "required": true, "options": [{"id": "A", "label": "期末仍在职人员", "desc": "需要人员列表和离职/冻结规则", "status": "需导出人员列表", "recommended": true}, {"id": "B", "label": "统计期间曾在职", "desc": "需要入职与离职日期", "status": "需导出人员列表", "recommended": false}, {"id": "C", "label": "当前在职人员", "desc": "反映导出时点，不一定等于历史月份", "status": "需导出人员列表", "recommended": false}, {"id": "D", "label": "MCP 可见人员", "desc": "可快速预览，但不能称为公司全员", "status": "MCP临时口径", "recommended": false}]}, {"id": "biz_type", "title": "业务类型", "required": true, "options": [{"id": "A", "label": "全部", "desc": "买卖、租赁、新房", "status": "MCP直接支持", "recommended": true}, {"id": "B", "label": "买卖", "desc": "二手房买卖业务", "status": "MCP直接支持", "recommended": false}, {"id": "C", "label": "租赁", "desc": "租房业务", "status": "MCP直接支持", "recommended": false}, {"id": "D", "label": "新房", "desc": "新房业务", "status": "MCP直接支持", "recommended": false}]}];
const state = JSON.parse(localStorage.getItem("erp_requirement_demo_state") || "{}");
const root = document.getElementById("questions");
const statusEl = document.getElementById("status");
const fallback = document.getElementById("fallback");

function badgeClass(text) {
  return text.includes("直接") ? "reco" : "";
}
function render() {
  root.innerHTML = "";
  QUESTIONS.forEach((q, qi) => {
    const section = document.createElement("section");
    section.className = "card";
    section.innerHTML = `<div class="qhead"><div class="num">${qi+1}</div><div class="qtitle">${q.title}<span class="required">必选</span></div></div><div class="options"></div>`;
    const options = section.querySelector(".options");
    q.options.forEach(opt => {
      const el = document.createElement("div");
      el.className = "option" + (state[q.id] === opt.id ? " selected" : "");
      el.tabIndex = 0;
      el.setAttribute("role","radio");
      el.setAttribute("aria-checked", state[q.id] === opt.id ? "true" : "false");
      el.innerHTML = `<div class="option-top"><div class="label">${opt.id}. ${opt.label}</div><div class="check">${state[q.id]===opt.id?"✓":""}</div></div>
        <div class="desc">${opt.desc}</div>
        <div class="tags"><span class="tag ${badgeClass(opt.status)}">${opt.status}</span>${opt.recommended?'<span class="tag reco">推荐</span>':""}</div>`;
      const choose = () => { state[q.id]=opt.id; persist(); render(); };
      el.onclick = choose;
      el.onkeydown = e => { if(e.key==="Enter"||e.key===" "){e.preventDefault();choose();} };
      options.appendChild(el);
    });
    root.appendChild(section);
  });
  updateSummary();
}
function persist() { localStorage.setItem("erp_requirement_demo_state", JSON.stringify(state)); }
function selections() {
  return QUESTIONS.map(q => {
    const opt = q.options.find(o => o.id === state[q.id]);
    return opt ? {question_id:q.id, option_id:opt.id, label:opt.label, support_status:opt.status} : null;
  }).filter(Boolean);
}
function humanText() {
  const labels = {
    owner_role:"开单归属", date_basis:"日期口径", staff_denominator:"人员分母", biz_type:"业务类型"
  };
  return selections().map(s => `${labels[s.question_id]}=${s.label}`).join("；");
}
function payload() {
  return {
    schema_version:"1.0",
    session_id:"demo-no-real-data",
    request_summary:"计算人均开单量和开单率",
    selections:selections(),
    human_summary:humanText(),
    submission_mode:"clipboard_fallback",
    contains_real_business_data:false
  };
}
function updateSummary() {
  const done = selections().length;
  document.getElementById("progressText").textContent=`已完成 ${done}/${QUESTIONS.length} 项`;
  document.getElementById("bar").style.width=`${done/QUESTIONS.length*100}%`;
  document.getElementById("submit").disabled=done!==QUESTIONS.length;
  document.getElementById("summary").innerHTML=done
    ? selections().map(s=>`<div>✓ ${s.label} <span class="tag">${s.support_status}</span></div>`).join("")
    : "尚未完成选择。";
}
document.getElementById("recommend").onclick=()=>{ QUESTIONS.forEach(q=>{const r=q.options.find(o=>o.recommended); if(r) state[q.id]=r.id;}); persist(); render(); };
document.getElementById("reset").onclick=()=>{ Object.keys(state).forEach(k=>delete state[k]); persist(); fallback.style.display="none"; statusEl.textContent=""; render(); };
document.getElementById("download").onclick=()=>{
  const blob=new Blob([JSON.stringify(payload(),null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="erp_requirement_selection.json";a.click();URL.revokeObjectURL(a.href);
};
document.getElementById("submit").onclick=async()=>{
  const p=payload();
  // Host may inject this documented adapter after it has been verified.
  if(window.__ERP_SKILL_BRIDGE__ && typeof window.__ERP_SKILL_BRIDGE__.submitSelection==="function"){
    try {
      const result=await window.__ERP_SKILL_BRIDGE__.submitSelection(p);
      if(result && result.ok){ statusEl.textContent="已通过经过验证的 WorkBuddy 桥接提交。"; return; }
    } catch(e) {}
  }
  const text=p.human_summary;
  try {
    await navigator.clipboard.writeText(text);
    statusEl.textContent="已复制选择结果。请返回 WorkBuddy 粘贴发送。";
  } catch(e) {
    fallback.value=text;fallback.style.display="block";fallback.select();
    statusEl.textContent="浏览器未授予剪贴板权限，请复制下方文本。";
  }
};
render();
</script>
</body>
</html>
