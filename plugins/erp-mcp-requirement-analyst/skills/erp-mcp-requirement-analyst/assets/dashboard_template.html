<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>@@REPORT_TITLE@@</title>
  <style>
    :root{--bg:#f5f5f7;--panel:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--blue:#0071e3;--blue-soft:#e8f2ff;--warn:#9a6700;--warn-bg:#fff8e6;--shadow:0 8px 24px rgba(0,0,0,.06)}
    @media(prefers-color-scheme:dark){:root{--bg:#111113;--panel:#1c1c1e;--text:#f5f5f7;--muted:#a1a1a6;--line:#3a3a3c;--blue:#2997ff;--blue-soft:#132a42;--warn:#ffd479;--warn-bg:#332b18;--shadow:none}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0}.wrap{max-width:1180px;margin:auto;padding:28px 18px 64px}h1{margin:0;font-size:36px;line-height:1.18}.sub{margin-top:10px;color:var(--muted);line-height:1.65}.panel,.metric,.section{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.panel,.section{padding:20px;margin-top:16px}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:12px;align-items:end}.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:13px}.field select,.field input,.search input{width:100%;min-height:42px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);font:inherit}.btn{min-height:42px;padding:9px 14px;border:0;border-radius:8px;background:var(--blue);color:#fff;font:inherit;font-weight:650;cursor:pointer}.notice,.copybox{margin-top:12px;padding:12px;border-radius:8px;line-height:1.55}.notice{background:var(--warn-bg);color:var(--warn)}.copybox{border:1px solid var(--line);background:var(--blue-soft);white-space:pre-wrap;word-break:break-word}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}.metric{padding:18px}.label{color:var(--muted);font-size:14px}.value{margin-top:9px;font-size:32px;font-weight:750}.waiting{font-size:20px;color:var(--muted)}.link{color:var(--blue);text-decoration:underline;text-underline-offset:4px;cursor:pointer}.unit{margin-left:4px;color:var(--muted);font-size:15px}.formula{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.5}.section h2,.panel h2{margin:0 0 14px;font-size:20px}.empty{padding:24px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center}.search{max-width:340px;margin-bottom:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted)}.pill{display:inline-block;margin-top:10px;padding:4px 8px;border-radius:8px;background:var(--blue-soft);color:var(--blue);font-size:12px}details{margin-top:14px;color:var(--muted)}@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr}}@media(max-width:520px){.filters{grid-template-columns:1fr}h1{font-size:30px}}
  </style>
</head>
<body>
<main class="wrap">
  <h1 id="title"></h1>
  <div class="sub" id="plainSummary"></div>
  <section class="panel">
    <h2>筛选当前结果</h2>
    <div class="filters" id="filters"></div>
    <div class="notice" id="filterNotice"></div>
    <div class="copybox" id="copyStatus" hidden></div>
  </section>
  <div class="metrics" id="metrics"></div>
  <section class="section">
    <h2>结果说明</h2>
    <div id="businessExplanation" class="sub"></div>
    <details><summary>数据来源与技术说明</summary><div id="technical"></div></details>
  </section>
  <section class="section">
    <h2>已加载明细</h2>
    <div class="search"><input id="search" placeholder="搜索当前已加载明细"></div>
    <div id="details"></div>
  </section>
  <section class="section"><h2>限制与下一步</h2><div id="limits"></div></section>
</main>
<script id="report-data" type="application/json">@@REPORT_JSON@@</script>
<script>
let report;
try{report=JSON.parse(document.getElementById("report-data").textContent)}catch(error){report={meta:{title:"加载失败"},metrics:[],datasets:{},queries:[],limitations:["页面数据没有成功载入。"]}}
const esc=(value)=>String(value??"").replace(/[&<>"']/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
const selected=(id)=>document.getElementById(id)?.value||"";
let currentDataset="";

function metricValue(metric){
  if(metric.missing||metric.value===undefined||metric.value===null||metric.value==="")return '<span class="waiting">暂无可验证数据</span>';
  return `${esc(metric.value)}<span class="unit">${esc(metric.unit||"")}</span>`;
}

function renderRows(data){
  if(!Array.isArray(data)||!data.length)return '<div class="empty">当前页面没有加载明细。</div>';
  const term=(document.getElementById("search")?.value||"").toLowerCase();
  const filtered=data.filter((row)=>!term||JSON.stringify(row).toLowerCase().includes(term));
  if(!filtered.length)return '<div class="empty">没有匹配的明细。</div>';
  const columns=[...new Set(filtered.flatMap((row)=>Object.keys(row)))].slice(0,18);
  return `<table><thead><tr>${columns.map((column)=>`<th>${esc(column)}</th>`).join("")}</tr></thead><tbody>${filtered.map((row)=>`<tr>${columns.map((column)=>`<td>${esc(row[column])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

function buildPrompt(){
  return `请用 ERP MCP 按下面条件重新查询：\n报表：${report.meta?.title||"ERP 数据看板"}\n时间：${selected("filterTime")}\n查看范围：${selected("filterScope")}\n业务类型：${selected("filterBiz")}\n说明：这是普通静态结果页，实时筛选请打开插件提供的 MCP Apps Widget。`;
}

async function copyPrompt(){
  const box=document.getElementById("copyStatus");
  const prompt=buildPrompt();
  try{await navigator.clipboard.writeText(prompt);box.textContent="查询条件已复制，请回到聊天窗口发送。"}catch(error){box.textContent=`请手动复制下面的查询条件：\n\n${prompt}`}
  box.hidden=false;
}

function renderFilters(){
  const filters=report.filters||{};
  const time=filters.time_options||[report.meta?.date_range?.label||"当前时间"];
  const scope=filters.scope_options||["全公司"];
  const biz=filters.biz_options||report.meta?.biz_types||["全部"];
  document.getElementById("filters").innerHTML=`<div class="field"><label>时间</label><select id="filterTime">${time.map((item)=>`<option>${esc(item)}</option>`).join("")}</select></div><div class="field"><label>查看范围</label><select id="filterScope">${scope.map((item)=>`<option>${esc(item)}</option>`).join("")}</select></div><div class="field"><label>业务类型</label><select id="filterBiz">${biz.map((item)=>`<option>${esc(item)}</option>`).join("")}</select></div><button class="btn" id="applyFilter">${filters.requires_requery?"复制条件重新查询":"应用当前页筛选"}</button>`;
  document.getElementById("filterNotice").textContent=filters.requires_requery?"这是普通静态结果页，不能直接连接 ERP。需要实时筛选时，请使用插件提供的 MCP Apps Widget。":"这些筛选只作用于当前已加载的数据。";
  document.getElementById("applyFilter").onclick=filters.requires_requery?copyPrompt:()=>renderDetails(currentDataset);
}

function renderMetrics(){
  const html=(report.metrics||[]).map((metric)=>{
    const drilldown=metric.drilldown||{};
    const embedded=Boolean(drilldown.available&&drilldown.dataset_id&&(report.datasets||{})[drilldown.dataset_id]);
    return `<article class="metric"><div class="label">${esc(metric.label)}</div><div class="value ${embedded?"link":""}" data-dataset="${esc(embedded?drilldown.dataset_id:"")}" data-reason="${esc(drilldown.reason||"这个数字当前没有同口径明细。")}">${metricValue(metric)}</div><div class="formula">${esc(metric.business_formula||metric.formula||"")}</div><span class="pill">${embedded?"可点击查看已加载明细":"点击查看说明"}</span></article>`;
  }).join("");
  document.getElementById("metrics").innerHTML=html||'<div class="empty">暂无可验证指标。</div>';
}

function renderDetails(datasetId){
  currentDataset=datasetId||currentDataset||Object.keys(report.datasets||{})[0]||"";
  document.getElementById("details").innerHTML=renderRows((report.datasets||{})[currentDataset]||[]);
}

function init(){
  document.getElementById("title").textContent=report.meta?.title||"ERP 数据看板";
  document.getElementById("plainSummary").textContent=report.meta?.plain_summary||"这是根据已取得的数据生成的结果页。";
  renderFilters();renderMetrics();renderDetails();
  document.getElementById("businessExplanation").textContent=report.business_explanation||"主页面只展示业务结果，技术信息放在折叠区。";
  document.getElementById("technical").innerHTML=renderRows(report.queries||[]);
  const notes=[...(report.limitations||[]).map((text)=>({类型:"限制",说明:text})),...(report.export_recommendations||[]).map((text)=>({类型:"下一步",说明:typeof text==="string"?text:JSON.stringify(text)}))];
  document.getElementById("limits").innerHTML=renderRows(notes);
  document.getElementById("metrics").addEventListener("click",(event)=>{const target=event.target.closest("[data-dataset]");if(!target)return;const id=target.dataset.dataset;if(id)renderDetails(id);else{const box=document.getElementById("copyStatus");box.textContent=target.dataset.reason;box.hidden=false}});
  document.getElementById("search").addEventListener("input",()=>renderDetails(currentDataset));
}
init();
</script>
</body>
</html>
