<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>@@REPORT_TITLE@@</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--blue:#007aff;--soft:#eaf3ff;--orange:#ff9f0a;--red:#ff3b30;--green:#34c759;--shadow:0 14px 38px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#101014;--card:#1c1c1e;--text:#f5f5f7;--muted:#a1a1a6;--line:#38383a;--soft:rgba(10,132,255,.16);--shadow:0 18px 42px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1200px;margin:auto;padding:32px 18px 70px}h1{font-size:38px;margin:0 0 9px}.sub{color:var(--muted);line-height:1.6}.panel,.metric,.section{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.panel{padding:20px;margin-top:22px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:12px;align-items:end}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.field select,.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text);font:inherit}.btn{padding:12px 16px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:var(--soft);color:var(--blue)}.notice{margin-top:13px;border-radius:13px;padding:12px;background:rgba(255,159,10,.12);color:var(--muted);line-height:1.55}.copybox{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--soft);color:var(--text);white-space:pre-wrap;word-break:break-word}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:15px}.metric{padding:20px}.label{color:var(--muted);font-size:14px}.value{font-size:34px;font-weight:780;margin-top:10px}.waiting{font-size:22px;color:var(--muted)}.link{color:var(--blue);text-decoration:underline;text-underline-offset:4px;cursor:pointer}.unit{font-size:15px;color:var(--muted);margin-left:4px}.formula{font-size:13px;color:var(--muted);line-height:1.5;margin-top:8px}.section{padding:22px;margin-top:15px}.section h2{margin:0 0 14px}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:700}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:12px}.warn{background:rgba(255,159,10,.14);color:var(--orange)}.bad{background:rgba(255,59,48,.14);color:var(--red)}details{margin-top:14px;color:var(--muted)}.search{max-width:320px;margin:0 0 12px}.search input{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text)}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr}}@media(max-width:560px){.filters{grid-template-columns:1fr}h1{font-size:30px}}
</style>
</head>
<body>
<main class="wrap">
<h1 id="title"></h1><div class="sub" id="plainSummary"></div>
<div class="notice" id="autoDefaultNotice" style="display:none"></div>
<section class="panel"><h2 style="margin-top:0">筛选与查询</h2><div class="filters" id="filters"></div><div class="notice" id="filterNotice"></div><div class="copybox" id="copyStatus" style="display:none"></div></section>
<div class="metrics" id="metrics"></div>
<section class="section"><h2>结果说明</h2><div id="businessExplanation" class="sub"></div><details><summary>数据来源与技术说明</summary><div id="technical"></div></details></section>
<section class="section"><h2>明细与汇总</h2><div class="search"><input id="search" placeholder="搜索当前明细"></div><div id="details"></div></section>
<section class="section"><h2>限制与下一步</h2><div id="limits"></div></section>
</main>
<script id="report-data" type="application/json">@@REPORT_JSON@@</script>
<script>
let report;try{report=JSON.parse(document.getElementById("report-data").textContent)}catch(e){report={load_error:String(e),meta:{title:"加载失败"},metrics:[],datasets:{},limitations:["页面数据没有成功载入。"]}}
const esc=v=>String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[s]));
function metricValue(m){if(m.missing||m.value===undefined||m.value===null||m.value==="")return `<span class="waiting">等待查询</span>`;return `${esc(m.value)}<span class="unit">${esc(m.unit||"")}</span>`}
function rows(data){if(!data||!data.length)return '<div class="empty">暂无可验证明细。</div>';const term=(document.getElementById("search")?.value||"").toLowerCase();const filtered=data.filter(r=>!term||JSON.stringify(r).toLowerCase().includes(term));if(!filtered.length)return '<div class="empty">没有匹配的明细。</div>';const cols=[...new Set(filtered.flatMap(o=>Object.keys(o)))].slice(0,18);return '<table><thead><tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr></thead><tbody>'+filtered.map(r=>'<tr>'+cols.map(c=>`<td>${esc(r[c])}</td>`).join('')+'</tr>').join('')+'</tbody></table>'}
function selectedValue(id){const el=document.getElementById(id);return el?el.value:""}
function realtimeBridge(){const candidates=[window.app,window.workbuddy,window.WorkBuddy,window.mcpApp];return candidates.find(x=>x&&typeof x.callServerTool==="function")||null}
function realtimeConfig(){return report.realtime||{}}
function canRealtimeQuery(){const rt=realtimeConfig();return Boolean(rt.enabled&&rt.query_tool&&realtimeBridge())}
function buildQueryArgs(){return {title:report.meta?.title||"ERP 数据看板",time:selectedValue("filterTime"),scope:selectedValue("filterScope"),bizType:selectedValue("filterBiz"),keyword:selectedValue("filterKeyword")||"",source:"erp-mcp-requirement-analyst-dashboard"}}
function buildRequeryPrompt(){const args=buildQueryArgs();return `请用 erp MCP 按下面条件重新查询，并重新生成交互 HTML：\n报表：${args.title}\n时间：${args.time}\n查看范围：${args.scope}\n业务类型：${args.bizType}\n关键词：${args.keyword||"无"}\n说明：这是从普通 HTML 结果页发回来的条件。当前页面没有实时查询通道，请由 WorkBuddy 在聊天里安全调用 ERP。`}
async function copyRequeryPrompt(){const text=buildRequeryPrompt();const box=document.getElementById("copyStatus");try{await navigator.clipboard.writeText(text);box.textContent="已复制查询条件。请回到 WorkBuddy 聊天窗口粘贴发送，我会在那里重新调用 ERP 查询。"}catch(e){box.textContent="当前浏览器不允许自动复制。请手动复制下面这段文字，回到 WorkBuddy 聊天窗口发送：\n\n"+text}box.style.display="block"}
function extractReportPayload(resp){return resp?.structuredContent?.report||resp?.structuredContent?.dashboard||resp?.structuredContent||resp?.report||resp}
async function runRealtimeQuery(){const box=document.getElementById("copyStatus");const bridge=realtimeBridge();const rt=realtimeConfig();if(!bridge||!rt.query_tool){await copyRequeryPrompt();return}box.style.display="block";box.textContent="正在通过 WorkBuddy 安全读取 ERP 数据...";const args=buildQueryArgs();try{let resp;try{resp=await bridge.callServerTool({name:rt.query_tool,arguments:args})}catch(first){resp=await bridge.callServerTool(rt.query_tool,args)}const next=extractReportPayload(resp);if(!next||(!next.metrics&&!next.datasets)){throw new Error("查询返回内容不能直接渲染")}report={...report,...next,filters:{...(report.filters||{}),...(next.filters||{})},realtime:{...rt,...(next.realtime||{})}};box.textContent="已按当前条件更新页面。";init()}catch(e){box.textContent="页面实时查询没有成功。原因可能是当前页面不是 WorkBuddy 原生实时看板，或后台没有提供实时查询工具。\n\n你仍然可以复制下面的条件回到聊天里查询：\n\n"+buildRequeryPrompt()}}
function renderFilters(){const root=document.getElementById("filters");const f=report.filters||{};const time=f.time_options||[report.meta?.date_range?.label||"当前时间"];const scopes=f.scope_options||["全公司"];const biz=f.biz_options||report.meta?.biz_types||["全部"];const needsServer=Boolean(f.requires_requery);const live=needsServer&&canRealtimeQuery();const rtWanted=needsServer&&realtimeConfig().enabled;const buttonText=!needsServer?"应用当前页筛选":live?"按当前条件查询":"复制条件，回聊天查询";root.innerHTML=`<div class="field"><label>时间</label><select id="filterTime">${time.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div><div class="field"><label>查看范围</label><select id="filterScope">${scopes.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div><div class="field"><label>业务类型</label><select id="filterBiz">${biz.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div><div class="field"><label>关键词</label><input id="filterKeyword" placeholder="人员、门店或小区"></div><button class="btn" id="applyFilter">${buttonText}</button>`;document.getElementById("filterNotice").textContent=f.notice||(!needsServer?"当前页面只筛选已经加载的数据，不会重新连接 ERP 后台。":live?"这是 WorkBuddy 原生实时看板。点击查询后，会通过 WorkBuddy 安全读取 ERP，页面会自动更新。":rtWanted?"当前打开的是普通 HTML 页面，不是实时看板，所以不能自己连接 ERP。需要重新读取 ERP 时，请复制条件回到聊天里继续查询。":"切换月份、层级或业务类型需要重新读取 ERP。当前页面没有实时查询通道，请复制条件回到 WorkBuddy 聊天里查询。");document.getElementById("applyFilter").onclick=()=>{if(!needsServer){renderDetails(currentDataset)}else if(live){runRealtimeQuery()}else{copyRequeryPrompt()}}}
function renderMetrics(){const root=document.getElementById("metrics");root.innerHTML=(report.metrics||[]).map(m=>{const d=m.drilldown||{};const clickable=d.available&&d.dataset_id&&d.exact_reconciliation;return `<article class="metric"><div class="label">${esc(m.label)}</div><div class="value ${clickable?'link':''}" data-dataset="${esc(d.dataset_id||'')}">${metricValue(m)}</div><div class="formula">${esc(m.business_formula||m.formula||'')}</div><p>${clickable?'<span class="pill">可查看明细</span>':'<span class="pill warn">可查看说明</span>'}</p></article>`}).join("")||'<div class="empty">暂无可验证指标。</div>'}
let currentDataset=null;function renderDetails(id){currentDataset=id||Object.keys(report.datasets||{})[0];document.getElementById("details").innerHTML=rows((report.datasets||{})[currentDataset]||[])}
function init(){document.getElementById("title").textContent=report.meta?.title||"ERP 数据看板";document.getElementById("plainSummary").textContent=report.meta?.plain_summary||"这是根据已取得的数据生成的交互结果页。";const autoDefaulted=report.selection?.auto_defaulted||report.meta?.auto_defaulted;if(autoDefaulted){const n=document.getElementById("autoDefaultNotice");n.style.display="block";n.textContent="因为 5 分钟内没有收到确认，本次先按推荐方案生成。你仍然可以重新修改选择并生成新页面。"}renderFilters();renderMetrics();document.getElementById("businessExplanation").textContent=report.business_explanation||"结果会优先用普通中文说明，接口和字段细节放在下方技术说明里。";document.getElementById("technical").innerHTML=rows(report.queries||[]);document.getElementById("limits").innerHTML=rows([...(report.limitations||[]).map(x=>({类型:"限制",说明:x})),...(report.export_recommendations||[]).map(x=>({类型:"下一步",说明:typeof x==="string"?x:JSON.stringify(x)}))]);renderDetails();document.getElementById("metrics").addEventListener("click",e=>{const el=e.target.closest("[data-dataset]");if(!el)return;const id=el.getAttribute("data-dataset");if(id){renderDetails(id);document.getElementById("details").scrollIntoView({behavior:"smooth"})}});document.getElementById("search").addEventListener("input",()=>renderDetails(currentDataset));}
init();
</script>
</body>
</html>
