<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>@@REPORT_TITLE@@</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--blue:#007aff;--soft:#eaf3ff;--orange:#ff9f0a;--red:#ff3b30;--green:#34c759;--shadow:0 14px 38px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#101014;--card:#1c1c1e;--text:#f5f5f7;--muted:#a1a1a6;--line:#38383a;--soft:rgba(10,132,255,.16);--shadow:0 18px 42px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1200px;margin:auto;padding:32px 18px 70px}h1{font-size:38px;margin:0 0 9px}.sub{color:var(--muted);line-height:1.6}.panel,.metric,.section{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.panel{padding:20px;margin-top:22px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:12px;align-items:end}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.field select,.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text);font:inherit}.btn{padding:12px 16px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:var(--soft);color:var(--blue)}.notice{margin-top:13px;border-radius:13px;padding:12px;background:rgba(255,159,10,.12);color:var(--muted);line-height:1.55}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:15px}.metric{padding:20px}.label{color:var(--muted);font-size:14px}.value{font-size:34px;font-weight:780;margin-top:10px}.waiting{font-size:22px;color:var(--muted)}.link{color:var(--blue);text-decoration:underline;text-underline-offset:4px;cursor:pointer}.unit{font-size:15px;color:var(--muted);margin-left:4px}.formula{font-size:13px;color:var(--muted);line-height:1.5;margin-top:8px}.section{padding:22px;margin-top:15px}.section h2{margin:0 0 14px}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:700}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:12px}.warn{background:rgba(255,159,10,.14);color:var(--orange)}.bad{background:rgba(255,59,48,.14);color:var(--red)}details{margin-top:14px;color:var(--muted)}.search{max-width:320px;margin:0 0 12px}.search input{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text)}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr}}@media(max-width:560px){.filters{grid-template-columns:1fr}h1{font-size:30px}}
</style>
</head>
<body>
<main class="wrap">
<h1 id="title"></h1><div class="sub" id="plainSummary"></div>
<section class="panel"><h2 style="margin-top:0">筛选与查询</h2><div class="filters" id="filters"></div><div class="notice" id="filterNotice"></div></section>
<div class="metrics" id="metrics"></div>
<section class="section"><h2>结果说明</h2><div id="businessExplanation" class="sub"></div><details><summary>数据来源与技术说明</summary><div id="technical"></div></details></section>
<section class="section"><h2>明细与汇总</h2><div class="search"><input id="search" placeholder="搜索当前明细"></div><div id="details"></div></section>
<section class="section"><h2>限制与下一步</h2><div id="limits"></div></section>
</main>
<script id="report-data" type="application/json">@@REPORT_JSON@@</script>
<script>
let report;try{report=JSON.parse(document.getElementById("report-data").textContent)}catch(e){report={load_error:String(e),meta:{title:"加载失败"},metrics:[],datasets:{},limitations:["页面数据没有成功载入。"]}}
const esc=v=>String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[s]));
function metricValue(m){if(m.missing||m.value===undefined||m.value===null||m.value==="")return `<span class="waiting">等待查询</span>`;return `${esc(m.value)}<span class="unit">${esc(m.unit||"")}</span>`}
function rows(data){if(!data||!data.length)return '<div class="empty">暂无可验证明细。</div>';const term=(document.getElementById("search")?.value||"").toLowerCase();const filtered=data.filter(r=>!term||JSON.stringify(r).toLowerCase().includes(term));if(!filtered.length)return '<div class="empty">没有匹配的明细。</div>';const cols=[...new Set(filtered.flatMap(o=>Object.keys(o)))].slice(0,18);return '<table><thead><tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr></thead><tbody>'+filtered.map(r=>'<tr>'+cols.map(c=>`<td>${esc(r[c])}</td>`).join('')+'</tr>').join('')+'</tbody></table>'}
function renderFilters(){const root=document.getElementById("filters");const f=report.filters||{};const time=f.time_options||[report.meta?.date_range?.label||"当前时间"];const scopes=f.scope_options||["全公司"];const biz=f.biz_options||report.meta?.biz_types||["全部"];const other=f.other||[];root.innerHTML=`<div class="field"><label>时间</label><select id="filterTime">${time.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div><div class="field"><label>查看范围</label><select id="filterScope">${scopes.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div><div class="field"><label>业务类型</label><select id="filterBiz">${biz.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div><div class="field"><label>关键词</label><input id="filterKeyword" placeholder="人员、门店或小区"></div><button class="btn" id="applyFilter">${f.requires_requery?"按此条件重新查询":"应用筛选"}</button>`;document.getElementById("filterNotice").textContent=f.notice||"如果切换条件需要重新查询，页面会明确提示，不会假装已经取得新数据。";document.getElementById("applyFilter").onclick=()=>{if(f.requires_requery){alert("这个条件需要重新调用 ERP 查询。请把当前筛选条件发回 WorkBuddy 继续查询。")}else{renderDetails(currentDataset)}}}
function renderMetrics(){const root=document.getElementById("metrics");root.innerHTML=(report.metrics||[]).map(m=>{const d=m.drilldown||{};const clickable=d.available&&d.dataset_id&&d.exact_reconciliation;return `<article class="metric"><div class="label">${esc(m.label)}</div><div class="value ${clickable?'link':''}" data-dataset="${esc(d.dataset_id||'')}">${metricValue(m)}</div><div class="formula">${esc(m.business_formula||m.formula||'')}</div><p>${clickable?'<span class="pill">可查看明细</span>':'<span class="pill warn">可查看说明</span>'}</p></article>`}).join("")||'<div class="empty">暂无可验证指标。</div>'}
let currentDataset=null;function renderDetails(id){currentDataset=id||Object.keys(report.datasets||{})[0];document.getElementById("details").innerHTML=rows((report.datasets||{})[currentDataset]||[])}
function init(){document.getElementById("title").textContent=report.meta?.title||"ERP 数据看板";document.getElementById("plainSummary").textContent=report.meta?.plain_summary||"这是根据已取得的数据生成的交互结果页。";renderFilters();renderMetrics();document.getElementById("businessExplanation").textContent=report.business_explanation||"结果会优先用普通中文说明，接口和字段细节放在下方技术说明里。";document.getElementById("technical").innerHTML=rows(report.queries||[]);document.getElementById("limits").innerHTML=rows([...(report.limitations||[]).map(x=>({类型:"限制",说明:x})),...(report.export_recommendations||[]).map(x=>({类型:"下一步",说明:typeof x==="string"?x:JSON.stringify(x)}))]);renderDetails();document.getElementById("metrics").addEventListener("click",e=>{const el=e.target.closest("[data-dataset]");if(!el)return;const id=el.getAttribute("data-dataset");if(id){renderDetails(id);document.getElementById("details").scrollIntoView({behavior:"smooth"})}});document.getElementById("search").addEventListener("input",()=>renderDetails(currentDataset));}
init();
</script>
</body>
</html>
